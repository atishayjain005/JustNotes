<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes app</title>
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body id="bgColor">
    <a class="skip-link" href="#main">Skip to notes</a>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #273037">
        <a class="navbar-brand mx-5" href="#">
            <h3 style="
            letter-spacing: 5px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #c29dfa, 4px 4px 25px #934ffa,
              4px 4px 0px #6600ff;
          ">
                JustNotes.
            </h3>
        </a>
        <div class="navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <span class="text-light">Saved in this browser only</span>
                </li>
            </ul>
            <form class="form-inline ms-auto mx-3 my-2 my-lg-0 d-inline-flex">
                <input id="searchTxt" class="form-control mx-2" type="search" placeholder="Search your note here" aria-label="Search" />
                <button class="btn btn-outline-warning my-2 my-sm-0" type="submit">
            Search
          </button>
            </form>
        </div>
    </nav>

    <div class="container-fluid m-0 p-0" style="
        background-image: url(wave.svg);
        background-repeat: no-repeat;
        background-size: contain;
        background-position: start;
      ">
        <main class="container py-3" id="main">
            <h1 class="text-light text-center my-5" style="font-size: 3.5rem" width="fit-content">
                Welcome to
                <span style="
              font-weight: bold;
              text-shadow: 3px 3px 0px #c29dfa, 6px 6px 25px #934ffa,
                6px 6px 0px #6600ff;
            ">JustNotes.</span
          >
        </h1>
        <div
          class="card mt-4 border-0 shadow-lg"
          style="
            border-radius: 40px 8px;
            background-image: linear-gradient(
              to right,
              rgba(255, 0, 0, 0.342),
              rgba(0, 0, 255, 0.342),
              rgba(0, 128, 0, 0.342)
            );
          "
        >
          <div
            class="card-body border-0 text-dark bg-transparent"
            style="border-radius: 2rem 1rem"
          >
            <div class="form-group">
              <label for="addTxt">Write a note</label>
              <textarea class="form-control" id="addTxt" rows="3"></textarea>
            </div>
            <button id="addBtn" class="btn btn-outline-light mt-3 px-3">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                fill="currentColor"
                class="bi bi-plus-lg"
                viewbox="0 0 20 20"
              >
                <path
                  d="M8 0a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2H9v6a1 1 0 1 1-2 0V9H1a1 1 0 0 1 0-2h6V1a1 1 0 0 1 1-1z"
                />
              </svg>
              Add Note
            </button>
          </div>
        </div>
        <h2 class="mt-5">Your Notes</h2>
        <hr />
        <div id="notes" class="row container-fluid"></div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
